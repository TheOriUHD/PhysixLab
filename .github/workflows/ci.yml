name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint (ESLint, type-aware)
        run: npm run lint
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Unit & physics tests (real Rapier engine in Node)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Bundle-size budget
        run: npm run size

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: End-to-end tests (headless Chromium, software WebGL)
        run: E2E_SHOTS=1 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/out
