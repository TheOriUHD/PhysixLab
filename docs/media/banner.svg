<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="PhysicsLab: an advanced 3D physics sandbox in your browser">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1422"/>
      <stop offset="0.6" stop-color="#080c15"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#e0f7ff"/><stop offset="0.35" stop-color="#38bdf8"/><stop offset="1" stop-color="#1d4ed8"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.5"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot" cx="0.18" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#spot)"/>
  <rect x="1" y="1" width="1278" height="358" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <!-- perspective grid floor -->
  <g stroke="#5eead4" stroke-opacity="0.09" stroke-width="1.5" fill="none">
    <path d="M0 262H1280"/><path d="M0 290H1280"/><path d="M0 322H1280"/>
    <path d="M640 236V360"/><path d="M420 236L120 360"/><path d="M860 236L1160 360"/><path d="M200 236L-80 360"/><path d="M1080 236L1360 360"/>
  </g>
  <!-- trajectory + ball -->
  <path d="M72 300C130 170 190 120 250 124s98 78 150 34" fill="none" stroke="url(#arc)" stroke-width="12" stroke-linecap="round"/>
  <g fill="#5eead4" fill-opacity="0.5"><circle cx="96" cy="236" r="5"/><circle cx="126" cy="188" r="5"/><circle cx="160" cy="156" r="5"/></g>
  <circle cx="420" cy="128" r="64" fill="url(#glow)"/>
  <circle cx="420" cy="128" r="38" fill="url(#ball)"/>
  <ellipse cx="407" cy="114" rx="11" ry="7" fill="#fff" fill-opacity="0.65" transform="rotate(-30 407 114)"/>
  <ellipse cx="420" cy="296" rx="46" ry="8" fill="#000" fill-opacity="0.5" filter="url(#soft)"/>
  <!-- wordmark -->
  <g font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="500" y="168" font-size="108" font-weight="300" fill="#e8eef9" letter-spacing="-2">Physics<tspan font-weight="800" fill="url(#word)">Lab</tspan></text>
    <text x="504" y="214" font-size="30" font-weight="500" fill="#9fb0c8" letter-spacing="0.2">An advanced 3D physics sandbox that runs entirely in your browser.</text>
    <g font-size="21" font-weight="600" letter-spacing="0.6" fill="#5eead4" fill-opacity="0.9">
      <text x="504" y="262">RIGID BODIES  ·  JOINTS &amp; MOTORS  ·  SOFT BODIES  ·  VEHICLES  ·  TIME TRAVEL</text>
    </g>
  </g>
</svg>
