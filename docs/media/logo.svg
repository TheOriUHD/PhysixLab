<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="PhysixLab logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171f2e"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6df0dc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#a5ecff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="60" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="58.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- the track: one bounce arc; the ball sits exactly on its line, at the highest point -->
  <g transform="translate(0 -6)">
  <path d="M52 186C80 96 120 74 152 96s36 56 52 78" fill="none" stroke="url(#track)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="128.4" cy="88.1" r="25" fill="url(#ball)"/>
  </g>
</svg>
